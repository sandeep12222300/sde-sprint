id:3,week:"Week 1: CS Fundamentals",weekLabel:"Memory",title:"OS - Memory Management, Paging, Virtual Memory, GC in Java",category:"CS",summary:"Virtual memory gives each process illusion of large memory via page tables. Paging splits into 4KB pages. TLB caches translations. In Java, GC replaces manual free but thrashing and fragmentation still matter.",morning:"Paging, Segmentation, TLB, Page faults, Thrashing. How virtual -> physical mapping works.",evening:"JVM Heap: Young/Old/Metaspace, Mark & Sweep, G1GC basics. Use jstat / VisualVM to see GC pauses.",night:"Explain: Why Java needs GC? What is stop-the-world? Write difference between paging and swapping.",resources:[{label:"Gate Smashers - Paging",url:"https://www.youtube.com/watch?v=o2n1K8ys_Bw"},{label:"Java GC - Oracle",url:"https://www.oracle.com/webfolder/technetwork/tutorials/obe/java/gc01/index.html"}],task:"Diagram: Virtual memory flow + JVM heap layout"},{id:4,week:"Week 1: CS Fundamentals",weekLabel:"Concurrency",title:"OS - Concurrency in Java - synchronized, volatile, Executor",category:"CS",summary:"synchronized gives mutual exclusion + visibility. volatile gives visibility only. Executor decouples task from thread creation. Race conditions happen when check-then-act without lock.",morning:"synchronized, volatile, happens-before, CAS, ReentrantLock, ReadWriteLock, Atomic classes.",evening:"Build counter with 100 threads: broken -> synchronized -> AtomicInteger -> LongAdder. Test ExecutorService fixed vs cached.",night:"Explain volatile vs synchronized to a junior in 3 lines. Note when to use ConcurrentHashMap.",resources:[{label:"Java Concurrency - Jakob Jenkov",url:"https://www.youtube.com/watch?v=W8x2_3n_Lrw"},{label:"Java Docs - High Level Concurrency",url:"https://docs.oracle.com/javase/tutorial/essential/concurrency/highlevel.html"}],task:"GitHub repo: concurrency-playground with 4 fixes"},{id:5,week:"Week 1: CS Fundamentals",weekLabel:"DBMS Transactions",title:"DBMS - ACID, Transactions, Isolation Levels",category:"CS",summary:"ACID: Atomicity via rollback, Consistency via constraints, Isolation via locks, Durability via WAL. Isolation levels trade correctness vs throughput: READ_COMMITTED allows non-repeatable reads, REPEATABLE_READ prevents it.",morning:"ACID deep dive, WAL, redo/undo, Lost update, Dirty read, Phantom read. 4 isolation levels + snapshot isolation.",evening:"In MySQL: SET TRANSACTION ISOLATION LEVEL; demo dirty read. In Spring: @Transactional propagation & isolation.",night:"Table: Isolation level vs anomaly matrix. Explain why Spring default is REQUIRED.",resources:[{label:"Gate Smashers - Transaction & ACID",url:"https://www.youtube.com/watch?v=W6U2b2Jz1t4"},{label:"ByteByteGo - Isolation Levels",url:"https://bytebytego.com/courses/transactional/acid-properties-and-isolation-levels"}],task:"Notion page: ACID explained with Java + SQL snippets"},{id:6,week:"Week 1: CS Fundamentals",weekLabel:"DBMS Indexing",title:"DBMS - Indexing - B-Tree, Hash, Composite, Query Optimization",category:"CS",summary:"B-Tree keeps data sorted for range queries O(log n). Hash is O(1) but no range. Composite index follows leftmost prefix rule. EXPLAIN shows if index is used or full scan.",morning:"B-Tree vs B+Tree, Hash index, Composite index, Covering index, Clustered vs Non-clustered, EXPLAIN.",evening:"Create 1M rows table, add index, compare SELECT * WHERE age>30. Use EXPLAIN ANALYZE. Fix slow query with composite index.",night:"Write 3 golden rules of indexing. Note when index hurts write performance.",resources:[{label:"Gate Smashers - Indexing",url:"https://www.youtube.com/watch?v=fsG1XaZEa78"},{label:"Use The Index, Luke!",url:"https://use-the-index-luke.com/"}],task:"Screenshot before/after EXPLAIN + index DDL"},{id:7,week:"Week 1: CS Fundamentals",weekLabel:"DBMS Design",title:"DBMS - Joins, Normalization, Sharding, Replication",category:"CS",summary:"Joins combine tables. Normalization removes redundancy (1NF-3NF). Sharding splits data horizontally for scale. Replication copies data for availability; lag causes eventual consistency.",morning:"INNER, LEFT, RIGHT, CROSS joins. 1NF,2NF,3NF, BCNF. Vertical vs Horizontal sharding, Consistent hashing, Replication models.",evening:"Design e-commerce schema normalized. Then denormalize for feed. Draw sharding key strategy for orders table.",night:"When would you shard? Write pros/cons of replication vs sharding.",resources:[{label:"ByteByteGo - Sharding vs Partitioning",url:"https://bytebytego.com/courses/system-design-interview/what-is-database-sharding"},{label:"Gate Smashers - Normalization",url:"https://www.youtube.com/watch?v=xoTyrdT9SZI"}],task:"ER diagram: users, products, orders with sharding key annotated"},{id:8,week:"Week 1: CS Fundamentals",weekLabel:"Networks",title:"CN - OSI, TCP vs UDP, 3-way handshake, TLS",category:"CS",summary:"OSI 7 layers = mental model, TCP/IP 4 layers = reality. TCP is reliable, ordered, connection-oriented via 3-way handshake (SYN, SYN-ACK, ACK). UDP is fire-and-forget. TLS adds encryption on top of TCP.",morning:"OSI vs TCP/IP, TCP header, flow control, congestion control, UDP, TLS 1.2 vs 1.3 handshake.",evening:"Use Wireshark to capture handshake. curl -v https://example.com to see TLS. Code TCP echo server in Java (ServerSocket).",night:"Explain 3-way handshake to a non-tech friend. Why QUIC uses UDP?",resources:[{label:"Gate Smashers - TCP 3-Way Handshake",url:"https://www.youtube.com/watch?v=VK1T4tPz0qQ"},{label:"ByteByteGo - How HTTPS Works",url:"https://bytebytego.com/courses/system-design-interview/how-does-https-work"}],task:"Sequence diagram: TCP + TLS handshake"},{id:9,week:"Week 1: CS Fundamentals",weekLabel:"HTTP & Infra",title:"CN - HTTP 1.1 vs 2 vs 3, DNS, CORS, Load Balancer, CDN, Proxy",category:"CS",summary:"HTTP/1.1 has head-of-line blocking. HTTP/2 multiplexes streams over one TCP. HTTP/3 uses QUIC over UDP to avoid TCP HOL. DNS resolves names, CDN caches at edge, LB distributes traffic, proxy hides origin.",morning:"HTTP versions diff, DNS recursion, CORS preflight, Forward vs Reverse proxy, L4 vs L7 LB, CDN pull/push.",evening:"Setup Nginx as reverse proxy + LB for 2 Spring Boot ports. Test CORS by calling API from different localhost port.",night:"List: When to use CDN vs LB? What does Access-Control-Allow-Origin do?",resources:[{label:"ByteByteGo - HTTP 1.1 vs 2 vs 3",url:"https://bytebytego.com/courses/system-design-interview/http-1-0-vs-http-1-1-vs-http-2-0-vs-http-3-0"},{label:"MDN - CORS",url:"https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS"}],task:"Architecture sketch: Client -> CDN -> LB -> API with CORS headers"},{id:10,week:"Week 1: CS Fundamentals",weekLabel:"OOP Revision",title:"OOP - 4 Pillars, SOLID, Cohesion Coupling + Revision",category:"CS",summary:"OOP pillars: Encapsulation, Abstraction, Inheritance, Polymorphism. SOLID guides maintainable design. High cohesion + low coupling = good module. This day locks CS for interviews.",morning:"4 pillars with Java examples. SOLID with violations & fixes. Cohesion vs Coupling, Composition over Inheritance.",evening:"Revision: Make 1-page cheat sheet for all 10 days. Create 20 interview Q&A cards (Anki style).",night:"Teach back: Explain ACID, TCP handshake, B-Tree in 2 min each. Record voice note.",resources:[{label:"SOLID Principles - Java Brains",url:"https://www.youtube.com/watch?v=2E5o8-R1w5M"},{label:"OOP Concepts - Derek Banas",url:"https://www.youtube.com/watch?v=Q8oCilQ82p8"}],task:"Upload CS cheat sheet PDF to GitHub /notes folder"},{id:11,week:"Week 2: System Design",weekLabel:"LLD Basics",title:"LLD Basics - Class Diagrams, SOLID in Java, UML",category:"Design",summary:"LLD is about classes, relations, and responsibilities. UML class diagram shows association, composition, inheritance. SOLID in Java = small interfaces, depend on abstractions, inject via constructor.",morning:"UML: class, sequence, use-case. Identify nouns->classes, verbs->methods. SOLID applied to real Java service.",evening:"Design TinyURL LLD in Java: classes ShortUrl, UrlRepository, HashService. Draw UML on Excalidraw.",night:"Checklist: Does design violate SRP? Are dependencies injected? Write 5 LLD interview tips.",resources:[{label:"Gaurav Sen - LLD Playlist Intro",url:"https://www.youtube.com/watch?v=3oMPyTq0o4k"},{label:"UML Diagrams - Visual Paradigm",url:"https://www.visual-paradigm.com/guide/uml-unified-modeling-language/what-is-uml/"}],task:"Excalidraw: TinyURL LLD class diagram"},{id:12,week:"Week 2: System Design",weekLabel:"LLD Patterns",title:"LLD Patterns - Singleton, Factory, Builder, Strategy, Observer",category:"Design",summary:"Singleton = one instance (enum safest in Java). Factory = create without exposing logic. Builder = telescoping constructors fix. Strategy = swap algorithms. Observer = pub-sub for events.",morning:"Pattern intent, problem, Java code, pros/cons. When NOT to use Singleton.",evening:"Implement all 5 in Java: Singleton enum, Factory for Notification (Email/SMS), Builder for User, Strategy for Payment, Observer for Order status.",night:"Map patterns to Spring: @Component singleton, FactoryBean, Builder via Lombok, Strategy via Map of beans.",resources:[{label:"Gaurav Sen - Singleton Factory",url:"https://www.youtube.com/watch?v=t65De6x5v1g"},{label:"Refactoring Guru - Patterns in Java",url:"https://refactoring.guru/design-patterns/java"}],task:"GitHub: design-patterns-java repo with 5 examples + README"},{id:13,week:"Week 2: System Design",weekLabel:"LLD Practice",title:"LLD - Design LRU Cache, Parking Lot",category:"Design",summary:"LRU Cache = HashMap + Doubly Linked List for O(1) get/put, evict tail. Parking Lot = use cases: entry, payment, spots, vehicle types. Start with requirements, then classes, then code.",morning:"LRU design tradeoffs, LinkedHashMap vs custom. Parking Lot requirements, actors, classes, enums.",evening:"Code LRU Cache in Java with concurrency. Then Parking Lot with Strategy for pricing, Observer for display. Write unit tests.",night:"Interview drill: Explain LRU in 90 seconds. Write edge cases for Parking Lot (full, disabled spot).",resources:[{label:"Gaurav Sen - LRU Cache",url:"https://www.youtube.com/watch?v=7AB0B8U0uLk"},{label:"Gaurav Sen - Parking Lot LLD",url:"https://www.youtube.com/watch?v=7h2y1a5C9iA"}],task:"Push LRU + Parking Lot Java projects with tests"},{id:14,week:"Week 2: System Design",weekLabel:"HLD Basics",title:"HLD Basics - Scalability, CAP, Consistency, Latency vs Throughput",category:"Design",summary:"Scalability = handle more load via vertical/horizontal scaling. CAP = pick 2 of 3. Strong consistency = everyone sees same now. Eventual = sync later. Latency = time per request, Throughput = requests per sec.",morning:"Scalability patterns, CAP theorem with examples (CP: Zookeeper, AP: Cassandra), Consistency models, Latency vs Throughput vs Availability.",evening:"Calculate: QPS, storage, bandwidth for 1M DAU app. Draw simple scalable arch: client -> LB -> app -> cache -> DB.",night:"Write: Why you cannot have both strong consistency and 100% availability during partition? Example.",resources:[{label:"Gaurav Sen - CAP Theorem",url:"https://www.youtube.com/watch?v=BHqj4zAAd4I"},{label:"ByteByteGo - Scalability",url:"https://bytebytego.com/courses/system-design-interview/what-is-scalability"}],task:"Notion: HLD glossary + back-of-envelope template"},{id:15,week:"Week 2: System Design",weekLabel:"HLD URL Shortener",title:"HLD - URL Shortener (Design in Java)",category:"Design",summary:"Need: low latency read, high write, Base62 encoding. Use consistent hashing for DB sharding, Redis for hot URLs, auto-increment + Base62 or pre-generated keys. 301 redirect for SEO.",morning:"Requirements, API: POST /shorten, GET /{code}, Non-functional: 100M URLs/month, 10:1 read:write, 7 year expiry.",evening:"Design: hash vs counter, collision handling, DB schema, cache, analytics, rate limiter. Draw end-to-end flow. Sketch Java API with Spring Boot.",night:"Edge: custom alias, expiry, malicious URL scan. Estimate storage: 100M * 500 bytes.",resources:[{label:"Gaurav Sen - URL Shortener",url:"https://www.youtube.com/watch?v=JQDHz72OAo4"},{label:"ByteByteGo - URL Shortener",url:"https://bytebytego.com/courses/system-design-interview/design-a-url-shortener"}],task:"Excalidraw: Full URL shortener HLD diagram"},{id:16,week:"Week 2: System Design",weekLabel:"HLD Chat",title:"HLD - Chat System - WhatsApp Design",category:"Design",summary:"Chat needs WebSocket for real-time, message queue for offline, presence service, push notification, media storage. Sequence numbers ensure ordering. Use fan-out for groups.",morning:"1-1 vs Group, online/offline, WebSocket vs Long Polling vs SSE, Message status (sent, delivered, read), Storage: messages sharded by conversationId.",evening:"Design flow: connection service, message service, presence via Redis, Kafka for delivery, S3 for media. Draw group chat fan-out.",night:"Calculate storage for 1B messages/day. How to handle message ordering in distributed nodes?",resources:[{label:"Gaurav Sen - Chat System",url:"https://www.youtube.com/watch?v=2DzM1K0O2fE"},{label:"ByteByteGo - Chat",url:"https://bytebytego.com/courses/system-design-interview/design-a-chat-system"}],task:"Diagram: WhatsApp HLD + API contract list"},{id:17,week:"Week 2: System Design",weekLabel:"HLD E-com",title:"HLD - E-commerce - Amazon Design",category:"Design",summary:"E-commerce = catalog read-heavy (cache + search), cart, checkout (strong consistency), inventory (pessimistic lock or optimistic with version), order saga pattern across services.",morning:"Microservices: user, catalog, cart, order, inventory, payment, search. Read vs write paths, eventual consistency for catalog.",evening:"Design checkout flow: cart -> lock inventory -> create order -> payment -> confirm. Use saga vs 2PC. Search with Elasticsearch, cache with Redis.",night:"Failure: inventory oversell prevention, payment idempotency key, order retry.",resources:[{label:"ByteByteGo - E-commerce",url:"https://bytebytego.com/courses/system-design-interview/design-an-ecommerce-website-like-amazon"},{label:"Gaurav Sen - Amazon Design",url:"https://www.youtube.com/watch?v=Nd2qj0bZ6pM"}],task:"Flowchart: Order saga with compensating transactions"},{id:18,week:"Week 2: System Design",weekLabel:"HLD Feed & Notify",title:"HLD - Notification System + News Feed",category:"Design",summary:"Notification = multi-channel (push, SMS, email), templating, rate limiting per user, priority queue. News Feed = fan-out on write for celebrities vs fan-out on read for normal users (hybrid).",morning:"Notification requirements, provider abstraction, retry, dedup. Feed: pull vs push models, ranking, pagination.",evening:"Design notification service with Kafka topics per priority. Feed: design timeline generation, cache feed in Redis, rank by recency + engagement.",night:"Tradeoff: Fan-out write cost vs read latency. How to avoid notification spam?",resources:[{label:"ByteByteGo - Notification",url:"https://bytebytego.com/courses/system-design-interview/design-a-notification-system"},{label:"ByteByteGo - News Feed",url:"https://bytebytego.com/courses/system-design-interview/design-a-news-feed-system"}],task:"Two diagrams: Notification + News Feed"},{id:19,week:"Week 2: System Design",weekLabel:"HLD Limits",title:"HLD - Rate Limiter + Search Autocomplete",category:"Design",summary:"Rate limiter protects backend: token bucket (smooth), fixed window (simple). Use Redis + Lua for atomic. Autocomplete = Trie in memory + ranking, Elasticsearch edge-ngram for persistence.",morning:"Algorithms: token bucket, leaky bucket, sliding window log/counter. Autocomplete data structure: Trie vs inverted index.",evening:"Design rate limiter middleware in Spring Boot with Redis. Autocomplete: build Trie Java + top-k via heap, sync to ES.",night:"Edge: distributed rate limiter clock skew, autocomplete typo tolerance.",resources:[{label:"ByteByteGo - Rate Limiter",url:"https://bytebytego.com/courses/system-design-interview/design-a-rate-limiter"},{label:"Gaurav Sen - Autocomplete",url:"https://www.youtube.com/watch?v=6s6F6a0b4eI"}],task:"Code: Rate limiter filter + Trie autocomplete API"},{id:20,week:"Week 2: System Design",weekLabel:"HLD Video",title:"HLD - Video Streaming + Revision",category:"Design",summary:"Video streaming needs upload -> transcode -> segmented (HLS/DASH) -> CDN. Storage tiered. Netflix uses pre-encoding multiple resolutions. Revision locks all HLD concepts.",morning:"Streaming vs progressive, HLS/DASH, transcoding pipeline, CDN, adaptive bitrate. Revision: redraw 5 HLDs from memory.",evening:"Design YouTube upload flow: presigned S3, Kafka to transcoder workers, metadata DB, CDN invalidation. Whiteboard 2 HLDs in 20 min each.",night:"Record Loom explaining one HLD. Write common interview mistakes.",resources:[{label:"Gaurav Sen - Video Streaming",url:"https://www.youtube.com/watch?v=PsLMR_n4h1Q"},{label:"ByteByteGo - YouTube",url:"https://bytebytego.com/courses/system-design-interview/design-youtube"}],task:"Portfolio: 7 HLD diagrams in /system-design folder"},{id:21,week:"Week 3: Projects",weekLabel:"Project Arch",title:"Project 1 Architecture - E-commerce Backend - ER Diagram, API Contract, Tech Stack Final",category:"Projects",summary:"Pick stack: Spring Boot 3, PostgreSQL, Redis, Kafka, S3, Elasticsearch, JWT. Design ER: users, products, cart, orders, payments. API contract = OpenAPI spec first.",morning:"Finalize features: Auth, Catalog, Cart, Orders, Payments (mock), Search, File upload. Write ER diagram, API list (15 endpoints).",evening:"Init repo: Spring Boot multi-module, docker-compose for Postgres/Redis/Kafka/ES. Write README with architecture diagram + tech stack.",night:"Create GitHub Project board: ToDo, InProgress, Done. Write ADR (Architecture Decision Record).",resources:[{label:"Spring Boot Docs - Building REST",url:"https://spring.io/guides/gs/rest-service/"},{label:"API Design - Zalando Guidelines",url:"https://opensource.zalando.com/restful-api-guidelines/"}],task:"Repo live with ER + API contract + compose up working"},{id:22,week:"Week 3: Projects",weekLabel:"Build Core",title:"Build Core - Auth JWT + RBAC + Product Module",category:"Projects",summary:"JWT = stateless auth, access + refresh tokens. RBAC = roles stored in DB, checked via @PreAuthorize. Product module = CRUD + pagination + caching.",morning:"Auth: Register, Login, JWT filter, BCrypt, Refresh token rotation, RBAC middleware. Security config.",evening:"Product: CRUD, validation, pagination, Redis cache (@Cacheable), S3 presigned for images later. Write integration tests.",night:"Test with Postman: login -> get token -> create product as ADMIN only.",resources:[{label:"Spring Security JWT - Official",url:"https://spring.io/guides/gs/securing-web/"},{label:"JWT Best Practices",url:"https://curity.io/resources/learn/jwt-best-practices/"}],task:"Commit: Auth + Product with tests passing"},{id:23,week:"Week 3: Projects",weekLabel:"Order Flow",title:"Build Order Flow + Payment Mock + Redis Cache + Kafka Queue",category:"Projects",summary:"Order flow needs inventory lock (SELECT FOR UPDATE), idempotency key to avoid double charge, Kafka to decouple email/inventory events, Redis for cart & rate limit.",morning:"Cart service (Redis), Order creation with transaction, Inventory check, Payment mock (Stripe mock), Idempotency table.",evening:"Add Kafka: order.created topic -> consumers for email, inventory update, analytics. Add Redis cache for product list, rate limiter filter.",night:"Failure test: place 2 orders concurrently for last item. Ensure only 1 succeeds.",resources:[{label:"Spring Kafka Docs",url:"https://docs.spring.io/spring-kafka/reference/"},{label:"Redis Caching with Spring",url:"https://spring.io/guides/gs/caching/"}],task:"Demo: Order placed -> Kafka event -> email logged"},{id:24,week:"Week 3: Projects",weekLabel:"Addons",title:"Add S3 File Upload + Elasticsearch + Email + Webhooks + Logging",category:"Projects",summary:"S3 for images via presigned URLs (no backend streaming). Elasticsearch for product search (edge_ngram). Email via SES/SendGrid async. Webhooks for payment events. Logging via SLF4J + JSON.",morning:"S3 module: presigned upload URL, image resize lambda idea. ES: index products, search with filters. Email service async with @Async + queue.",evening:"Webhooks: receive payment confirmation, verify signature, update order. Logging: correlationId filter, structured logs, actuator /health.",night:"Add Swagger UI, write README with curl examples. Record 2-min demo video.",resources:[{label:"AWS S3 Presigned URLs - Docs",url:"https://docs.aws.amazon.com/AmazonS3/latest/userguide/ShareObjectPreSignedURL.html"},{label:"Elasticsearch Java Client",url:"https://www.elastic.co/guide/en/elasticsearch/client/java-api-client/current/index.html"}],task:"Features merged: S3, ES, Email, Webhooks, Logging done"},{id:25,week:"Week 3: Projects",weekLabel:"Project 2",title:"Project 2 - Choose one: LRU Visualizer / Rate Limiter Library / Chat Backend",category:"Projects",summary:"Second project should be interview-talkable in 2 min and show CS depth. LRU Visualizer = React + Java API visualizing eviction. Rate Limiter Lib = Java annotation @RateLimit with Redis. Chat Backend = WebSocket + Kafka.",morning:"Pick one: LRU Visualizer (easiest, visual), Rate Limiter Library (impressive for backend), Chat Backend (hardest, best). Scaffold repo.",evening:"Build MVP: For Rate Limiter: token bucket + Redis Lua + annotation + auto-config. Write README with usage + benchmark.",night:"Add tests, GitHub Actions CI, publish to GitHub Packages note. Write blog-style README: problem, solution, design.",resources:[{label:"Build a Rate Limiter Lib - Java",url:"https://www.youtube.com/watch?v=FU4WlwfS3G0"},{label:"WebSocket with Spring",url:"https://spring.io/guides/gs/messaging-stomp-websocket/"}],task:"Second repo live with demo GIF in README"},{id:26,week:"Week 3: Projects",weekLabel:"Deploy",title:"Deploy Both - Docker, Docker Compose, GitHub Actions, Render/Fly.io, Domain + HTTPS",category:"Projects",summary:"Docker packages app + deps. Compose runs all locally. GitHub Actions builds & pushes image. Deploy to Render/Fly.io with Postgres addon, env vars, HTTPS auto.",morning:"Dockerfile multi-stage (Maven + JRE), docker-compose.prod.yml, .dockerignore. GitHub Actions: build, test, docker push, deploy hook.",evening:"Deploy: Render or Fly.io, add managed Postgres + Redis (Upstash), env secrets, custom domain, Cloudflare SSL, health checks.",night:"Final test: live URL, Postman collection hitting prod, add status badge to README. Update LinkedIn featured with live links.",resources:[{label:"Docker Multi-Stage - Docs",url:"https://docs.docker.com/build/building/multi-stage/"},{label:"Fly.io Java Deployment",url:"https://fly.io/docs/languages-and-frameworks/dockerfile/"},{label:"Render Docs",url:"https://render.com/docs"}],task:"Two live URLs + Docker + CI badge green"},{id:27,week:"Week 4: Interview Ready",weekLabel:"Resume",title:"Resume + GitHub + LinkedIn - ATS resume, Numbers, STAR, README templates",category:"Interview",summary:"Resume = 1 page, numbers > adjectives. STAR = Situation, Task, Action, Result. GitHub pinned repos need good README: demo, arch, tech, what you learned.",morning:"Rewrite resume: 3 bullets per project: built X using Y, improved Z by N%, handled M QPS. Use Jake's template LaTeX. ATS check with skill keywords.",evening:"GitHub: Pin 2 projects, archive old, write READMEs with architecture diagram, live link, setup. LinkedIn: headline 'Backend | Java | System Design', about with STAR, featured projects.",night:"Peer review resume in Discord/Reddit. Fix 5 times.",resources:[{label:"Jake's Resume Template",url:"https://www.overleaf.com/latex/templates/jakes-resume/syzfjbzwjncs"},{label:"ByteByteGo - Resume for SDE",url:"https://bytebytego.com/courses/career-growth/how-to-write-a-good-resume"}],task:"Resume PDF
